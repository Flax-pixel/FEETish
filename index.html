<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feetish — the daily ladder to FEET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14261F; --surface:#1E332A; --surface2:#25402F;
    --ink:#F1ECDD; --ink-dim:#B9C4B7;
    --amber:#D9A62E; --good:#6FA97A; --bad:#B65C3F;
    --serif:'Fraunces', serif; --sans:'Inter', sans-serif; --mono:'JetBrains Mono', monospace;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#EFEAD9; --surface:#E1DAC4; --surface2:#D3C9AC;
      --ink:#20301F; --ink-dim:#57604F;
    }
  }
  :root[data-theme="dark"]{ --bg:#14261F; --surface:#1E332A; --surface2:#25402F; --ink:#F1ECDD; --ink-dim:#B9C4B7; }
  *{margin:0;box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    min-height:100%; display:flex; justify-content:center; padding:32px 16px 48px;
    position:relative; overflow-x:hidden;
  }
  .wrap{width:100%; max-width:440px; position:relative; z-index:2;}
  header{text-align:center; margin-bottom:22px;}
  h1{
    font-family:var(--serif); font-weight:700; font-size:2.1rem; font-style:italic;
    letter-spacing:0.2px;
  }
  .tagline{color:var(--ink-dim); font-size:0.92rem; margin-top:4px; line-height:1.5;}
  .rule{color:var(--ink-dim); font-size:0.8rem; margin-top:12px; line-height:1.6; border-top:1px solid var(--surface2); padding-top:12px;}
  .board{ background:var(--surface); border-radius:14px; padding:20px 18px; position:relative; z-index:2;}
  .rung{ display:flex; align-items:center; gap:10px; padding:9px 0; }
  .rung .step-no{ width:20px; text-align:right; color:var(--ink-dim); font-size:0.78rem; font-family:var(--mono); flex-shrink:0;}
  .tiles{ display:flex; gap:6px; }
  .tile{
    width:40px; height:44px; border-radius:8px; background:var(--surface2);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:1.15rem; letter-spacing:0.5px;
    color:var(--ink); text-transform:uppercase;
  }
  .rung.target .tile{ background:var(--amber); color:#1A1206; }
  .connector{ text-align:center; color:var(--ink-dim); font-size:0.75rem; padding:2px 0 2px 30px; font-family:var(--mono);}
  .input-row{ display:flex; gap:10px; margin-top:14px; }
  input[type=text]{
    flex:1; background:var(--surface2); border:1px solid transparent; border-radius:8px;
    color:var(--ink); font-family:var(--mono); font-size:1.1rem; letter-spacing:2px;
    text-transform:uppercase; padding:10px 12px; text-align:center;
  }
  input[type=text]:focus{ outline:none; border-color:var(--amber); }
  button{
    background:var(--amber); color:#1A1206; border:none; border-radius:8px;
    font-family:var(--sans); font-weight:600; font-size:0.95rem; padding:0 18px; cursor:pointer;
  }
  button:disabled{ opacity:0.4; cursor:default; }
  .msg{ min-height:20px; font-size:0.85rem; margin-top:8px; text-align:center; }
  .msg.bad{ color:var(--bad); } .msg.good{ color:var(--good); }
  .stats{ display:flex; justify-content:space-between; margin-top:20px; padding-top:16px; border-top:1px solid var(--surface2); font-size:0.85rem; color:var(--ink-dim); }
  .stats b{ color:var(--ink); font-family:var(--mono); }
  .win{ text-align:center; padding:18px 6px 4px; }
  .win h2{ font-family:var(--serif); font-style:italic; font-size:1.4rem; margin-bottom:6px; }
  .win p{ color:var(--ink-dim); font-size:0.88rem; }
  .lose h2{ color:var(--bad); }
  footer{ text-align:center; color:var(--ink-dim); font-size:0.75rem; margin-top:18px; position:relative; z-index:2;}

  #footRain{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
  .falling-foot{
    position:absolute; top:-60px; font-size:32px; will-change:transform;
    animation-name:fall; animation-timing-function:linear; animation-fill-mode:forwards;
  }
  @keyframes fall{
    from{ transform:translateY(0) rotate(0deg); opacity:1; }
    to{ transform:translateY(115vh) rotate(360deg); opacity:0.9; }
  }
  @media (prefers-reduced-motion: reduce){
    .falling-foot{ animation-duration: 0.01s !important; }
  }
</style>
</head>
<body>
<div id="footRain"></div>
<div class="wrap">
  <header>
    <h1>Feetish</h1>
    <div style="text-align:center; font-weight:700; letter-spacing:1px; margin-top:-6px; margin-bottom:8px;">UDAY TYAGI</div>
    <div class="tagline">Get today's word down to <strong>FEET</strong>, one letter at a time.</div>
    <div class="rule" id="ruleText">Each new word must be real and differ from the last by exactly one letter.</div>
  </header>

  <div class="board" id="board">
    <!-- rungs injected here -->
    <div class="input-row" id="inputRow">
      <input type="text" id="guess" maxlength="4" autocomplete="off" spellcheck="false" placeholder="next word">
      <button id="submit">Enter</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="stats" id="stats"></div>
  <footer>New ladder every day, same for everyone.</footer>
</div>

  var WORD_SET = Object.create(null);
  for(var i=0;i<PACKED.length;i+=4){ WORD_SET[PACKED.substr(i,4)] = true; }
  function isWord(w){ return !!WORD_SET[w]; }

  var TARGET = "FEET";
  var EXTRA_TRIES = 5; // tries allowed beyond the shortest possible path

  // Pool of common starting words, each several real steps from FEET.
  // A new day picks the next word in the pool (deterministic, same for everyone).
  var POOL = ["BAND","HAND","LAND","COAT","GOAT","GOLD","HARD","HELP","LEAF","MILK",
  "PLAN","PLAY","ROAD","SALT","SAND","SOFT","STAR","WALL","WARM","WIND","WISH","WORD","WORK",
  "BIKE","BOOK","CORN","DARK","FARM","FIRE","GAME","GATE","HATE","HOME","HOPE","HOUR","IDEA",
  "LOVE","MOON","PATH","RAIN","ROOF","ROOM","ROOT","ROSE","SHIP","SILK","SING","SLOW","SONG",
  "SOUR","SWIM","TALK","WALK","WIDE","WOOL","JUMP","LAMP","LOCK","NOTE","RICE","SNOW"];

  var EPOCH = Date.UTC(2026, 0, 1); // puzzle #0
  function todayIndex(){
    var now = new Date();
    var utcMidnight = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var days = Math.floor((utcMidnight - EPOCH) / 86400000);
    return ((days % POOL.length) + POOL.length) % POOL.length;
  }
  var puzzleIdx = todayIndex();
  var START = POOL[puzzleIdx];
  var KEY = "feetish-" + puzzleIdx;

  function diffCount(a,b){ var n=0; for(var i=0;i<4;i++){ if(a[i]!==b[i]) n++; } return n; }

  // BFS over the dictionary to find the shortest real path from a word to FEET.
  function neighbors(w){
    var out = [];
    for(var pos=0; pos<4; pos++){
      for(var c=65; c<=90; c++){
        var letter = String.fromCharCode(c);
        if(letter === w[pos]) continue;
        var cand = w.substr(0,pos) + letter + w.substr(pos+1);
        if(WORD_SET[cand]) out.push(cand);
      }
    }
    return out;
  }
  function shortestPathLength(start){
    if(start === TARGET) return 0;
    var seen = {}; seen[start] = true;
    var queue = [[start, 0]];
    while(queue.length){
      var item = queue.shift(); var w = item[0], d = item[1];
      var ns = neighbors(w);
      for(var i=0; i<ns.length; i++){
        var nb = ns[i];
        if(nb === TARGET) return d+1;
        if(!seen[nb]){ seen[nb] = true; queue.push([nb, d+1]); }
      }
    }
    return null;
  }
  var PAR = shortestPathLength(START);
  var MAX_TRIES = (PAR === null ? 6 : PAR) + EXTRA_TRIES;
  document.getElementById('ruleText').textContent =
    'Each new word must be real and differ from the last by exactly one letter. ' +
    'Best possible path is ' + PAR + ' steps — you have ' + MAX_TRIES + ' tries.';

  // ---- storage ----
  function loadState(){
    try{ var raw = localStorage.getItem('feetish_state_v1'); return raw ? JSON.parse(raw) : {}; }
    catch(e){ return {}; }
  }
  function saveState(s){ try{ localStorage.setItem('feetish_state_v1', JSON.stringify(s)); }catch(e){} }
  var state = loadState();
  if(!state.chain || state.day !== KEY){
    state = { day: KEY, chain:[START], done:false, failed:false,
      streak: (state.streak||0), lastWin: state.lastWin || null };
    saveState(state);
  }

  // ---- render ----
  var board = document.getElementById('board');
  var inputRow = document.getElementById('inputRow');
  var msgEl = document.getElementById('msg');
  var statsEl = document.getElementById('stats');
  var guessEl = document.getElementById('guess');
  var submitBtn = document.getElementById('submit');

  function renderRungs(){
    var existing = board.querySelectorAll('.rung, .connector, .win');
    existing.forEach(function(e){ e.remove(); });
    state.chain.forEach(function(word, idx){
      if(idx>0){
        var c = document.createElement('div');
        c.className='connector'; c.textContent='↓';
        board.insertBefore(c, inputRow);
      }
      var row = document.createElement('div');
      row.className='rung' + (word===TARGET ? ' target' : '');
      var num = document.createElement('div');
      num.className='step-no'; num.textContent = idx===0 ? 'start' : idx;
      var tiles = document.createElement('div');
      tiles.className='tiles';
      for(var i=0;i<4;i++){
        var t=document.createElement('div');
        t.className='tile';
        t.textContent = word[i];
        tiles.appendChild(t);
      }
      row.appendChild(num); row.appendChild(tiles);
      board.insertBefore(row, inputRow);
    });

    if(state.done){
      inputRow.style.display='none';
      var win = document.createElement('div');
      win.className='win';
      var steps = state.chain.length-1;
      win.innerHTML = '<h2>Reached FEET</h2><p>'+steps+' try'+(steps===1?'':'s')+' to get there.</p>';
      board.insertBefore(win, inputRow);
    } else if(state.failed){
      inputRow.style.display='none';
      var lose = document.createElement('div');
      lose.className='win lose';
      lose.innerHTML = '<h2>YOU ARE A LARPER, YOU DONT ACTUALLY LIKE FEET</h2><p>Back tomorrow for a new ladder.</p>';
      board.insertBefore(lose, inputRow);
    } else {
      inputRow.style.display='flex';
    }
  }

  function renderStats(){
    var used = state.chain.length-1;
    var left = Math.max(MAX_TRIES - used, 0);
    statsEl.innerHTML =
      '<span>Streak <b>'+state.streak+'</b></span>' +
      '<span>Tries left <b>'+left+'</b></span>' +
      '<span>Puzzle <b>#'+(puzzleIdx+1)+'</b></span>';
  }

  function setMsg(text, cls){ msgEl.textContent = text; msgEl.className = 'msg' + (cls ? ' '+cls : ''); }

  function rainFeet(){
    var layer = document.getElementById('footRain');
    var count = 70;
    for(var i=0;i<count;i++){
      (function(){
        var el = document.createElement('div');
        el.className = 'falling-foot';
        el.textContent = '🦶';
        var left = Math.random()*100;
        var duration = 2.2 + Math.random()*2.2;
        var delay = Math.random()*1.4;
        var size = 20 + Math.random()*24;
        el.style.left = left+'vw';
        el.style.fontSize = size+'px';
        el.style.animationDuration = duration+'s';
        el.style.animationDelay = delay+'s';
        layer.appendChild(el);
        setTimeout(function(){ el.remove(); }, (duration+delay)*1000 + 200);
      })();
    }
  }

  function submitGuess(){
    if(state.done || state.failed) return;
    var g = guessEl.value.trim().toUpperCase();
    guessEl.value='';
    if(g.length!==4){ setMsg('Word must be 4 letters.','bad'); return; }
    var last = state.chain[state.chain.length-1];
    if(!isWord(g)){ setMsg('Not in word list','bad'); return; }
    if(diffCount(g,last)!==1){ setMsg('One letter not different','bad'); return; }
    if(state.chain.indexOf(g)!==-1){ setMsg('Already used '+g+'.','bad'); return; }

    state.chain.push(g);
    if(g===TARGET){
      state.done = true;
      if(state.lastWin !== KEY){ state.streak = (state.streak||0) + 1; state.lastWin = KEY; }
      setMsg('','');
      saveState(state);
      renderRungs(); renderStats();
      rainFeet();
      return;
    } else if(state.chain.length-1 >= MAX_TRIES){
      state.failed = true;
      setMsg('','');
    } else {
      setMsg('','');
    }
    saveState(state);
    renderRungs(); renderStats();
  }

  submitBtn.addEventListener('click', submitGuess);
  guessEl.addEventListener('keydown', function(e){ if(e.key==='Enter') submitGuess(); });

  renderRungs(); renderStats();
})();
</script>
